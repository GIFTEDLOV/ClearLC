name: ClearLC release gates

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile contract
        run: python -m compileall -q contracts
      - name: Contract and security tests
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen contract hash
        shell: bash
        run: |
          actual=$(sha256sum contracts/clearlc.py | cut -d' ' -f1)
          test "$actual" = "808c630d72223d11d58769b7c9261250357fe97e6426aa911aa7e1a8f2842a13"
      - name: Verify release identity strings
        shell: bash
        run: |
          grep -R "0x4771F6Ced792e786409046f26b1A1cEA905fC0d8" README.md docs artifacts >/dev/null
          grep -R "0x49Eba6C84256b81d8aEeED7A15f677f1A7A2C3e6" README.md docs artifacts frontend >/dev/null
          grep -R "808c630d72223d11d58769b7c9261250357fe97e6426aa911aa7e1a8f2842a13" README.md docs artifacts frontend >/dev/null
          grep -R "61997" README.md docs artifacts >/dev/null
          grep -R "CLC-V110-PAYOUT-1791047316713" README.md docs artifacts frontend >/dev/null
          grep -R "CLC-V110-REFUND-1791047316714" README.md docs artifacts frontend >/dev/null
